# Replace placeholders before use.
# Validate with: ansible-inventory -i inventory.ini --graph

[__GROUP_NAME__]
__HOST_A__ ansible_host=__HOST_A_IP__
__HOST_B__ ansible_host=__HOST_B_IP__

[__GROUP_NAME__:vars]
ansible_user=__REMOTE_USER__

# Prefer inventory/group_vars/host_vars for shared variables as the inventory grows.
# Do not store plaintext passwords or private keys in this file.
