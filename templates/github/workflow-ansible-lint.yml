---
name: Ansible validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install ansible-lint
        run: python -m pip install --upgrade pip ansible-lint

      - name: Run ansible-lint
        run: ansible-lint
