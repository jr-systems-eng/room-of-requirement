/var/log/example/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    dateext
    create 0640 root root

    # If the application can reopen logs, prefer postrotate/reload over copytruncate.
    # postrotate
    #     systemctl reload example.service >/dev/null 2>&1 || true
    # endscript
}
