services:
  app:
    image: example/image:latest
    container_name: example-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: UTC
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Prefer secrets files, environment injection, or a secret manager for credentials.
# Do not commit real passwords/tokens into compose files.
